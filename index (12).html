<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sua Saúde Digital — Encontre profissionais de saúde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Urbanist:wght@300..800&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F5F0;
    --ink:#1B2420;
    --ink-soft:#5B6560;
    --teal:#0F6E56;
    --teal-deep:#0A4A3A;
    --teal-pale:#E1F0EA;
    --line:#DCD8CE;
    --card:#FFFFFF;
    --coral:#D85A30;
    --r-lg:28px;
    --r-md:20px;
    --r-sm:14px;
    --float:0 1px 2px rgba(10,74,58,.05), 0 14px 34px -18px rgba(10,74,58,.28);
    --float-hover:0 2px 4px rgba(10,74,58,.06), 0 24px 44px -20px rgba(10,74,58,.38);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:3px;}
  .icon{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .icon-spin{animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* HEADER */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(247,245,240,.84);
    -webkit-backdrop-filter:saturate(1.4) blur(14px);
    backdrop-filter:saturate(1.4) blur(14px);
    border-bottom:1px solid transparent;
    transition:border-color .2s ease;
  }
  header.scrolled{border-bottom-color:var(--line);}
  .header-row{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px;}
  .logo{display:flex;align-items:baseline;gap:8px;text-decoration:none;}
  .logo-mark{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:23px;
    font-variation-settings:"opsz" 24;
    letter-spacing:-0.5px;
    color:var(--teal-deep);
    white-space:nowrap;
  }
  .logo-mark span{color:var(--coral);}
  .cta-cadastro{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13.5px;
    font-weight:600;
    color:#fff;
    background:var(--teal-deep);
    text-decoration:none;
    padding:11px 18px 11px 14px;
    border-radius:100px;
    transition:background .15s ease;
    white-space:nowrap;
  }
  .cta-cadastro .icon{width:16px;height:16px;}
  .cta-cadastro:hover{background:var(--teal);}

  /* HERO + BUSCA (painel) */
  .hero-panel{
    position:relative;
    z-index:5; /* mantém as listas da busca por cima dos cards */
    background:var(--teal-deep);
    color:var(--cream);
    border-radius:var(--r-lg);
    padding:80px 56px 36px;
    margin-top:8px;
    animation:panelIn .6s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes panelIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .hero{max-width:860px;}
  .hero h1{
    font-family:'Urbanist',system-ui,sans-serif;
    font-weight:400;
    font-size:clamp(38px,6.4vw,78px);
    line-height:1.02;
    letter-spacing:-0.03em;
    color:var(--cream);
    text-wrap:balance;
  }
  .hero h1::after{content:".";color:var(--coral);}
  .hero h1 em{font-style:normal;font-weight:700;}
  .hero p{
    font-size:17px;
    line-height:1.6;
    color:rgba(247,245,240,.74);
    max-width:470px;
    margin-top:22px;
  }

  .tabs-section{margin-top:48px;}

  /* Barra de busca segmentada */
  .search-console{
    display:flex;
    align-items:stretch;
    background:var(--card);
    color:var(--ink);
    border-radius:var(--r-md);
    padding:7px;
    box-shadow:0 28px 50px -28px rgba(0,0,0,.45);
  }
  .tag-search-wrap{
    position:relative;
    flex:1.5;
    min-width:0;
    padding:11px 18px;
    border-radius:var(--r-sm);
    transition:background .15s ease;
    cursor:text;
  }
  .tag-search-wrap:hover,.tag-search-wrap:focus-within{background:var(--cream);}
  .tag-search-label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:3px;
    cursor:text;
  }
  .tag-search-inner{display:flex;align-items:center;gap:10px;}
  .tag-search-icon{display:flex;color:var(--teal);}
  .tag-search-input{
    flex:1;min-width:0;
    border:none;outline:none;background:transparent;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    padding:1px 0;
  }
  .tag-search-input::placeholder{color:var(--ink-soft);opacity:.85;}
  .tag-search-clear{
    display:flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:50%;
    background:var(--line);color:var(--ink);
    cursor:pointer;flex-shrink:0;
  }
  .tag-search-clear .icon{width:12px;height:12px;stroke-width:2.4;}
  .tag-search-clear:hover{background:var(--teal-deep);color:#fff;}

  /* Sugestões da busca (especialidades + serviços) */
  .sugestoes{
    position:absolute;
    top:calc(100% + 14px);
    left:0;
    width:100%;
    min-width:320px;
    max-height:min(420px, 60vh);
    overflow-y:auto;
    background:var(--card);
    border-radius:18px;
    box-shadow:0 0 0 1px rgba(27,36,32,.06), 0 24px 48px -16px rgba(27,36,32,.28);
    padding:6px;
    z-index:30;
    display:none;
    cursor:default;
  }
  .sugestoes.open{display:block;animation:popIn .16s ease both;}
  .sug-grupo{
    font-size:12px;font-weight:600;
    color:var(--ink-soft);
    padding:10px 12px 6px;
  }
  .sug-item{
    display:flex;align-items:center;gap:12px;
    padding:9px 12px;
    border-radius:12px;
    cursor:pointer;
  }
  .sug-item:hover,.sug-item.ativo{background:var(--cream);}
  .sug-icon{
    width:32px;height:32px;flex-shrink:0;
    border-radius:10px;
    background:var(--teal-pale);color:var(--teal-deep);
    display:flex;align-items:center;justify-content:center;
  }
  .sug-icon .icon{width:16px;height:16px;}
  .sug-text{flex:1;min-width:0;}
  .sug-titulo{display:block;font-size:14.5px;font-weight:400;color:var(--ink);line-height:1.35;}
  .sug-titulo strong{font-weight:600;}
  .sug-sub{display:block;font-size:12.5px;color:var(--ink-soft);}
  .sug-count{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .sug-vazio{padding:14px 12px;font-size:13.5px;color:var(--ink-soft);}

  .filters-row{flex:1.3;display:flex;min-width:0;}
  .selector-wrap{position:relative;flex:1;min-width:0;}
  .selector-wrap::before{
    content:"";position:absolute;left:0;top:14px;bottom:14px;
    width:1px;background:var(--line);
  }
  .selector-btn{
    width:100%;height:100%;
    display:flex;align-items:center;gap:10px;
    padding:11px 16px 11px 18px;
    border-radius:var(--r-sm);
    cursor:pointer;
    user-select:none;
    transition:background .15s ease;
  }
  .selector-btn:hover,.selector-wrap.open .selector-btn{background:var(--cream);}
  .selector-icon{display:flex;color:var(--teal);}
  .selector-label{
    flex:1;min-width:0;text-align:left;
    font-size:15px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .selector-label::before{
    display:block;
    font-size:12px;font-weight:600;color:var(--ink);
    margin-bottom:3px;
  }
  #selectorCidadeLabel::before{content:"Cidade";}
  #selectorLabel::before{content:"Especialidade";}
  .selector-label.placeholder{color:var(--ink-soft);}
  .selector-chevron{display:flex;color:var(--ink-soft);transition:transform .2s ease;}
  .selector-chevron .icon{width:16px;height:16px;}
  .selector-wrap.open .selector-chevron{transform:rotate(180deg);}
  .selector-dropdown{
    position:absolute;
    top:calc(100% + 14px);
    left:0;
    min-width:100%;
    width:max-content;
    max-width:300px;
    background:var(--card);
    border-radius:18px;
    box-shadow:0 0 0 1px rgba(27,36,32,.06), 0 24px 48px -16px rgba(27,36,32,.28);
    padding:6px;
    z-index:20;
    display:none;
  }
  .selector-wrap:last-child .selector-dropdown{left:auto;right:0;}
  .selector-wrap.open .selector-dropdown{display:block;animation:popIn .16s ease both;}
  @keyframes popIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .selector-option{
    padding:11px 14px;
    border-radius:12px;
    cursor:pointer;
    font-size:14.5px;
    color:var(--ink);
    display:flex;justify-content:space-between;align-items:center;gap:16px;
  }
  .selector-option:hover{background:var(--cream);}
  .selector-option.active{background:var(--teal-pale);color:var(--teal-deep);font-weight:600;}
  .selector-option.active::after{
    content:"";width:14px;height:8px;
    border-left:2px solid currentColor;border-bottom:2px solid currentColor;
    transform:translateY(-2px) rotate(-45deg);
  }
  .selector-option-count{font-size:12px;color:var(--ink-soft);}

  /* GEOLOCALIZAÇÃO */
  .btn-geoloc{
    display:inline-flex;align-items:center;gap:8px;
    margin-top:18px;
    background:rgba(247,245,240,.08);
    border:1px solid rgba(247,245,240,.22);
    color:var(--cream);
    font-size:13px;font-weight:600;font-family:inherit;
    padding:9px 16px 9px 12px;
    border-radius:100px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .btn-geoloc .icon{width:16px;height:16px;}
  #geolocIcon{display:flex;}
  .btn-geoloc:hover{background:rgba(247,245,240,.16);border-color:rgba(247,245,240,.4);}
  .btn-geoloc:disabled{opacity:.75;cursor:default;}

  /* CONTAGEM */
  .result-count{
    display:flex;align-items:baseline;gap:8px;
    font-size:14px;
    color:var(--ink-soft);
    padding:44px 4px 22px;
  }
  .result-count strong{
    font-family:'Urbanist',system-ui,sans-serif;
    font-size:30px;font-weight:600;
    letter-spacing:-0.02em;
    color:var(--teal-deep);
    line-height:1;
  }

  /* ORIENTAÇÃO POR QUEIXA */
  .orientacao{
    display:flex;gap:16px;align-items:flex-start;
    background:var(--card);
    border-radius:var(--r-md);
    box-shadow:var(--float);
    padding:20px 22px;
    margin:0 0 28px;
  }
  .orientacao[hidden]{display:none;}
  .orientacao-icone{
    width:40px;height:40px;flex-shrink:0;
    border-radius:12px;
    background:var(--teal-pale);color:var(--teal-deep);
    display:flex;align-items:center;justify-content:center;
  }
  .orientacao-corpo{flex:1;min-width:0;}
  .orientacao-titulo{
    font-family:'Urbanist',system-ui,sans-serif;
    font-size:19px;font-weight:600;
    letter-spacing:-0.01em;
    color:var(--teal-deep);
    line-height:1.3;
    margin-bottom:10px;
  }
  .orientacao-corpo > p:not(.orientacao-nota){font-size:14.5px;color:var(--ink);max-width:62ch;}
  .orientacao-nota{font-size:13px;color:var(--ink-soft);margin-top:12px;}
  .esp-pills{display:flex;flex-wrap:wrap;gap:8px;}
  .esp-pill{
    display:inline-flex;align-items:center;gap:8px;
    font:inherit;font-size:14px;font-weight:600;
    color:var(--teal-deep);
    background:var(--teal-pale);
    border:1px solid transparent;
    border-radius:100px;
    padding:7px 8px 7px 14px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .esp-pill span{
    font-size:12px;font-weight:600;
    background:var(--card);
    border-radius:100px;
    padding:2px 8px;
  }
  button.esp-pill:hover{border-color:var(--teal);}
  .esp-pill-vazia{
    background:transparent;border-color:var(--line);
    color:var(--ink-soft);font-weight:500;cursor:default;
  }
  .esp-pill-vazia span{background:var(--cream);font-weight:500;}
  .orientacao-acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .orientacao-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--teal-deep);color:#fff;
    text-decoration:none;
    font-size:14px;font-weight:600;
    padding:11px 18px;
    border-radius:100px;
  }
  .orientacao-btn .icon{width:16px;height:16px;}
  .orientacao-btn-sec{background:transparent;color:var(--teal-deep);box-shadow:inset 0 0 0 1px var(--teal);}
  .orientacao-urgente{box-shadow:0 0 0 1.5px var(--coral), var(--float);}
  .orientacao-urgente .orientacao-icone{background:#FBE7DF;color:var(--coral);}
  .orientacao-urgente .orientacao-titulo{color:#A63E1C;}
  .orientacao-urgente .orientacao-btn{background:#B9461F;}
  .orientacao{margin-top:44px;scroll-margin-top:96px;}
  .orientacao:not([hidden]) + .result-count{padding-top:4px;}
  .orientacao-caminho{display:block;background:none;box-shadow:none;padding:0;}
  .caminho-contou{font-size:14px;color:var(--ink-soft);margin:0 4px 12px;}
  .caminho-contou span{color:var(--ink);font-weight:500;}
  .caminho-trocar{
    font:inherit;font-size:14px;font-weight:600;color:var(--teal);
    background:none;border:0;padding:0 0 0 6px;cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;
  }
  .caminho-bloco{background:var(--card);border-radius:var(--r-md);box-shadow:var(--float);padding:20px 22px;max-width:640px;}
  .etapas{display:flex;flex-direction:column;}
  .etapa{
    display:flex;align-items:center;gap:14px;
    width:100%;text-align:left;font:inherit;color:inherit;
    background:none;border:0;border-top:1px solid #EEEBE4;
    padding:12px 8px;margin:0 -8px;width:calc(100% + 16px);
    border-radius:12px;
  }
  .etapa:first-child{border-top-color:transparent;}
  button.etapa{cursor:pointer;}
  button.etapa:hover{background:var(--cream);}
  .etapa-num{
    width:26px;height:26px;flex-shrink:0;border-radius:50%;
    background:var(--teal-deep);color:#fff;
    font-family:'Urbanist',system-ui,sans-serif;font-size:13px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }
  .etapa-texto{flex:1;min-width:0;display:flex;flex-direction:column;}
  .etapa-nome{font-size:15px;font-weight:600;color:var(--ink);}
  .etapa-dica{font-size:13px;color:var(--ink-soft);}
  .etapa-qtd{
    font-size:12.5px;font-weight:600;color:var(--teal-deep);
    background:var(--teal-pale);border-radius:100px;padding:4px 10px;white-space:nowrap;
  }
  .etapa-vazia .etapa-num{background:var(--line);color:var(--ink-soft);}
  .etapa-vazia .etapa-nome{color:var(--ink-soft);}
  .etapa-qtd-vazia{background:transparent;color:var(--ink-soft);font-weight:500;box-shadow:inset 0 0 0 1px var(--line);}
  .secao-titulo{
    font-family:'Urbanist',system-ui,sans-serif;
    font-size:22px;font-weight:600;letter-spacing:-0.01em;color:var(--teal-deep);
  }
  .secao-qtd{font-size:14px;color:var(--ink-soft);}
  .result-count .secao-perto{
    margin-left:auto;align-self:center;
    display:inline-flex;align-items:center;gap:6px;
    font:inherit;font-size:13.5px;font-weight:600;color:var(--teal);
    background:none;border:0;cursor:pointer;padding:4px 0;
  }
  .secao-perto .icon{width:16px;height:16px;}
  .aviso-cidade{flex-basis:100%;margin-top:4px;font-size:13.5px;color:var(--ink-soft);}
  .result-count:has(.aviso-cidade){flex-wrap:wrap;}
  @media (max-width:560px){
    .caminho-bloco{padding:16px;}
    .result-count{flex-wrap:wrap;}
    .result-count .secao-perto{margin-left:0;width:100%;}
  }
  /* CONVERSA */
  /* Como funciona */
  .como-funciona{
    margin-top:22px;
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(247,245,240,.08);border:1px solid rgba(247,245,240,.22);
    color:var(--cream);font:inherit;font-size:13.5px;font-weight:600;
    padding:8px 12px 8px 14px;border-radius:100px;cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .como-funciona:hover{background:rgba(247,245,240,.16);border-color:rgba(247,245,240,.4);}
  .como-funciona .icon{width:16px;height:16px;transition:transform .2s ease;}
  .como-funciona[aria-expanded="true"] .icon{transform:rotate(180deg);}
  .como-funciona-lista{
    list-style:none;margin-top:18px;max-width:860px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 28px;
  }
  .como-funciona-lista[hidden]{display:none;}
  .como-funciona-lista li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5;color:rgba(247,245,240,.82);}
  .como-funciona-lista span{
    width:26px;height:26px;flex-shrink:0;border-radius:50%;
    background:rgba(247,245,240,.14);color:var(--cream);
    font-family:'Urbanist',system-ui,sans-serif;font-size:13px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }
  .como-funciona-lista:not([hidden]){animation:popIn .18s ease both;}

  /* Botões abaixo da busca: mesma largura, lado a lado */
  .hero-acoes{display:inline-grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
  .hero-acoes .btn-geoloc{margin-top:0;justify-content:center;}
  .btn-chat-hero{background:var(--cream);border-color:var(--cream);color:var(--teal-deep);}
  .btn-chat-hero:hover{background:#fff;border-color:#fff;}
  .chat-hero-icone{position:relative;display:inline-flex;}
  .chat-hero-icone::after{
    content:"";position:absolute;top:-2px;right:-3px;
    width:8px;height:8px;border-radius:50%;
    background:var(--coral);box-shadow:0 0 0 2px var(--cream);
  }
  .chat-hero-icone::before{
    content:"";position:absolute;top:-2px;right:-3px;
    width:8px;height:8px;border-radius:50%;background:var(--coral);
    animation:chatAviso 2.4s ease-out infinite;
  }
  @keyframes chatAviso{0%{transform:scale(1);opacity:.6;}70%,100%{transform:scale(2.6);opacity:0;}}
  .chat-fab{
    position:fixed;right:20px;bottom:20px;z-index:80;
    display:inline-flex;align-items:center;gap:8px;
    background:var(--teal-deep);color:#fff;border:0;
    font:inherit;font-size:14px;font-weight:600;
    padding:13px 18px 13px 15px;border-radius:100px;
    box-shadow:var(--float-hover);cursor:pointer;
    opacity:0;pointer-events:none;transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease;
  }
  .chat-fab.visivel{opacity:1;pointer-events:auto;transform:none;}
  .chat-fab.escondido{opacity:0;pointer-events:none;}
  .chat{
    position:fixed;right:24px;bottom:24px;z-index:90;
    width:min(400px, calc(100vw - 48px));height:min(640px, calc(100vh - 48px));
    display:flex;flex-direction:column;
    background:var(--cream);border-radius:24px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(27,36,32,.06), 0 30px 60px -20px rgba(10,74,58,.45);
    opacity:0;visibility:hidden;transform:translateY(14px);
    transition:opacity .2s ease, transform .2s ease, visibility 0s linear .2s;
  }
  .chat.open{opacity:1;visibility:visible;transform:none;transition:opacity .2s ease, transform .2s ease;}
  .chat-topo{
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    background:var(--teal-deep);color:var(--cream);padding:18px 18px 16px 20px;
  }
  .chat-titulo{font-family:'Urbanist',system-ui,sans-serif;font-size:18px;font-weight:600;letter-spacing:-0.01em;}
  .chat-sub{font-size:12.5px;color:rgba(247,245,240,.75);margin-top:2px;}
  .chat-fechar{
    width:34px;height:34px;flex-shrink:0;border-radius:50%;border:0;cursor:pointer;
    background:rgba(247,245,240,.12);color:var(--cream);
    display:flex;align-items:center;justify-content:center;
  }
  .chat-fechar .icon{width:16px;height:16px;}
  .chat-topo-acoes{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .chat-encerrar{
    height:34px;padding:0 14px;border-radius:100px;border:1px solid rgba(247,245,240,.28);cursor:pointer;
    background:none;color:var(--cream);font:inherit;font-size:13px;font-weight:600;
  }
  .chat-encerrar:hover{background:rgba(247,245,240,.12);}
  .chat-mic{
    width:44px;height:44px;flex-shrink:0;border-radius:50%;cursor:pointer;
    background:var(--cream);border:1px solid var(--line);color:var(--teal-deep);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .chat-mic .icon{width:20px;height:20px;}
  .chat-mic.gravando{background:var(--coral);border-color:var(--coral);color:#fff;}
  .chat-mic.gravando::after{
    content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--coral);
    animation:micPulso 1.2s ease-out infinite;
  }
  @keyframes micPulso{from{opacity:.7;transform:scale(.9);}to{opacity:0;transform:scale(1.25);}}
  @media (prefers-reduced-motion: reduce){.chat-mic.gravando::after{animation:none;}}
  .chat-msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;}
  .chat-msg{max-width:88%;font-size:14.5px;line-height:1.5;padding:11px 14px;border-radius:18px;animation:popIn .16s ease both;}
  .chat-msg-bot{align-self:flex-start;background:var(--card);color:var(--ink);border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(10,74,58,.06);}
  .chat-msg-eu{align-self:flex-end;background:var(--teal-deep);color:#fff;border-bottom-right-radius:6px;}
  .chat-msg-urgente{box-shadow:0 0 0 1.5px var(--coral);}
  .chat-msg-urgente strong{color:#A63E1C;}
  .chat-msg .ponto{color:var(--coral);}
  .chat-digitando{display:inline-flex;gap:4px;padding:4px 2px;}
  .chat-digitando i{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);opacity:.4;animation:chatPisca 1s infinite ease-in-out;}
  .chat-digitando i:nth-child(2){animation-delay:.15s;}
  .chat-digitando i:nth-child(3){animation-delay:.3s;}
  @keyframes chatPisca{50%{opacity:1;transform:translateY(-2px);}}
  .chat-atalhos{display:flex;flex-wrap:wrap;gap:6px;max-width:92%;}
  .chat-atalho{
    font:inherit;font-size:13.5px;font-weight:600;color:var(--teal-deep);
    background:var(--teal-pale);border:1px solid transparent;border-radius:100px;
    padding:7px 13px;cursor:pointer;
  }
  .chat-atalho:hover{border-color:var(--teal);}
  .chat-caminho{list-style:none;margin:10px 0 6px;}
  .chat-caminho li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;}
  .chat-caminho strong{display:block;font-size:14px;}
  .chat-caminho small{display:block;font-size:12.5px;color:var(--ink-soft);}
  .chat-num{
    width:22px;height:22px;flex-shrink:0;margin-top:1px;border-radius:50%;
    background:var(--teal-deep);color:#fff;font-size:12px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }
  .chat-caminho li.vazia .chat-num{background:var(--line);color:var(--ink-soft);}
  .chat-caminho li.vazia strong{color:var(--ink-soft);}
  .chat-nota{display:block;font-size:12px;color:var(--ink-soft);}
  .chat-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .chat-msg > .chat-btn{margin-top:10px;}
  .chat-btn{
    display:inline-flex;align-items:center;gap:6px;
    font:inherit;font-size:13.5px;font-weight:600;
    background:var(--teal-deep);color:#fff;border:0;text-decoration:none;
    padding:9px 14px;border-radius:100px;cursor:pointer;
  }
  .chat-btn .icon{width:15px;height:15px;}
  .chat-btn-urgente{background:#B9461F;}
  .chat-btn-sec{background:transparent;color:var(--teal-deep);box-shadow:inset 0 0 0 1px var(--teal);}
  .chat-cards{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .chat-card{display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:14px;padding:8px;cursor:pointer;}
  .chat-card:hover{background:var(--teal-pale);}
  .chat-card-foto{
    width:42px;height:42px;flex-shrink:0;border-radius:50%;overflow:hidden;
    background:var(--teal-pale);color:var(--teal-deep);
    font-family:'Urbanist',system-ui,sans-serif;font-size:14px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }
  .chat-card-foto img{width:100%;height:100%;object-fit:cover;}
  .chat-card-info{flex:1;min-width:0;}
  .chat-card-info strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-card-info small{display:block;font-size:12.5px;color:var(--ink-soft);}
  .chat-card-whats{
    width:36px;height:36px;flex-shrink:0;border-radius:50%;
    background:var(--teal-deep);color:#fff;display:flex;align-items:center;justify-content:center;
  }
  .chat-card-whats .icon{width:16px;height:16px;}
  .chat-form{display:flex;gap:8px;padding:12px;background:var(--card);border-top:1px solid var(--line);}
  .chat-form input{
    flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);
    background:var(--cream);border:1px solid var(--line);border-radius:100px;padding:11px 16px;
  }
  .chat-form input:focus{outline:none;border-color:var(--teal);}
  .chat-enviar{
    width:44px;height:44px;flex-shrink:0;border-radius:50%;border:0;cursor:pointer;
    background:var(--teal-deep);color:#fff;display:flex;align-items:center;justify-content:center;
  }
  @media (max-width:560px){
    .hero-acoes{display:grid;width:100%;}
    .hero-acoes .btn-geoloc{white-space:normal;text-align:center;line-height:1.3;min-height:50px;padding:9px 12px;font-size:13px;}
    .como-funciona-lista{grid-template-columns:1fr;gap:12px;}
    .chat{right:0;bottom:0;width:100%;height:100%;height:100dvh;border-radius:0;}
    .chat-form input{font-size:16px;}
    .chat-fab{right:16px;bottom:16px;}
  }
  @media (prefers-reduced-motion:reduce){
    .chat,.chat-fab,.chat-msg{transition:none;animation:none;}
    .chat-hero-icone::before{animation:none;opacity:0;}
    .chat-digitando i{animation:none;}
  }
  .orientacao-convite{background:var(--teal-pale);box-shadow:none;}
  .orientacao-convite .orientacao-icone{background:var(--card);}
  .orientacao-convite .orientacao-corpo > p:not(.orientacao-nota){color:var(--ink);}
  /* ===== Buscador compacto no cabeçalho (aparece ao rolar) ===== */
  .chat-fab{display:none !important;}
  header.com-busca{
    background:rgba(247,245,240,.8);border-bottom-color:var(--line);
    -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  }
  .busca-mini-faixa{
    flex:1;display:flex;justify-content:center;min-width:0;margin:0 20px;
    opacity:0;visibility:hidden;transform:translateY(-6px) scale(.97);
    transition:opacity .25s ease, transform .3s cubic-bezier(.32,1.3,.55,1), visibility 0s linear .25s;
  }
  header.com-busca .busca-mini-faixa{
    opacity:1;visibility:visible;transform:none;
    transition:opacity .25s ease, transform .3s cubic-bezier(.32,1.3,.55,1);
  }
  .busca-mini{
    display:flex;align-items:center;gap:10px;width:100%;max-width:480px;height:44px;
    background:#fff;border:1px solid var(--line);border-radius:100px;padding:0 5px 0 16px;
    box-shadow:0 6px 18px -12px rgba(10,74,58,.35);cursor:text;
  }
  .busca-mini:focus-within{border-color:var(--teal);}
  .busca-mini > .icon{width:18px;height:18px;color:var(--teal);flex-shrink:0;}
  .busca-mini input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--ink);}
  .busca-mini input::placeholder{color:#8A928D;}
  .busca-mini-chat{
    width:34px;height:34px;flex-shrink:0;border:0;border-radius:50%;cursor:pointer;
    background:var(--teal-pale);color:var(--teal-deep);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .busca-mini-chat .icon{width:16px;height:16px;}
  .busca-mini-chat::after{
    content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;
    background:var(--coral);box-shadow:0 0 0 2px var(--teal-pale);
  }
  /* com poucos resultados, a página não "pula" de volta para o balão enquanto a pessoa digita no cabeçalho */
  body.busca-fixa-ativa #grid{min-height:calc(100vh - 160px);}
  @media (max-width:560px){
    .busca-mini-faixa{
      position:absolute;left:0;right:0;top:100%;margin:0;
      padding:8px 14px 10px;
      background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:0;
      transform:translateY(-12px);
    }
    /* No celular a faixa fica abaixo do cabeçalho. Um desfoque dentro do outro não funciona,
       então um único fundo desfocado cobre cabeçalho + faixa, e os dois ficam iguais. */
    header.com-busca{background:transparent !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;border-bottom-color:transparent;}
    header.com-busca::before{
      content:"";position:absolute;left:0;right:0;top:0;height:calc(100% + 63px);z-index:-1;pointer-events:none;
      background:rgba(247,245,240,.8);
      -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
      border-bottom:1px solid var(--line);
    }
    .busca-mini{max-width:none;}
    .busca-mini input{font-size:16px;}
  }
  .sug-icon-urgente{background:#FBE7DF !important;color:#B9461F !important;}
  @media (max-width:560px){
    .orientacao{padding:18px;gap:12px;}
    .orientacao-icone{width:34px;height:34px;}
    .orientacao-titulo{font-size:17px;}
  }

  /* GRID */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(290px,1fr));
    gap:28px 22px;
    padding-bottom:88px;
  }
  .card{
    background:var(--card);
    border-radius:24px;
    padding:8px;
    cursor:pointer;
    box-shadow:var(--float);
    transition:transform .22s ease, box-shadow .22s ease;
    animation:fadeIn .4s ease both;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--float-hover);}
  .card:focus-visible{outline-offset:4px;border-radius:24px;}
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }
  .card-media{
    width:100%;
    aspect-ratio:6/7;
    background:var(--teal-pale);
    border-radius:18px;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .card-media img{
    width:100%;height:100%;object-fit:cover;object-position:center 15%;
    transition:transform .5s cubic-bezier(.2,.7,.2,1);
  }
  .card:hover .card-media img{transform:scale(1.035);}
  .avatar-fallback{
    font-family:'Urbanist',system-ui,sans-serif;
    font-size:64px;
    font-weight:500;
    letter-spacing:-0.03em;
    color:var(--teal);
  }
  .card-chip{
    position:absolute;top:12px;left:12px;
    font-size:12px;font-weight:600;
    color:var(--teal-deep);
    background:rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    padding:6px 12px;
    border-radius:100px;
  }
  .card-body{padding:16px 10px 10px;display:flex;flex-direction:column;flex:1;}
  .card-name{
    font-family:'Urbanist',system-ui,sans-serif;
    font-size:21px;
    font-weight:600;
    line-height:1.15;
    letter-spacing:-0.01em;
    color:var(--ink);
    margin-bottom:6px;
  }
  .card-category{
    display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .card-category .icon{width:14px;height:14px;color:var(--teal);}
  .card-distance{color:var(--teal);font-weight:600;}
  .card-distance::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--line);vertical-align:middle;margin:0 6px 2px 0;}
  .card-info{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;}
  .card-conv,.card-online{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12.5px;font-weight:500;line-height:1.2;
    padding:5px 10px 5px 8px;border-radius:100px;
  }
  .card-conv{color:var(--teal-deep);background:var(--cream);border:1px solid var(--line);}
  .card-conv-part{color:var(--ink-soft);}.card-conv-part .icon{color:var(--coral)!important;}
  .card-online{color:var(--teal-deep);background:var(--teal-pale);}
  .card-conv .icon,.card-online .icon{width:14px;height:14px;flex:none;color:var(--teal);}
  .card-desc{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.55;
    margin:12px 0 14px;
  }
  .card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  .tag-pill{
    font-size:12px;
    font-weight:500;
    color:var(--teal-deep);
    background:var(--teal-pale);
    padding:4px 10px;
    border-radius:100px;
    white-space:nowrap;
  }
  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:72px 20px;
    color:var(--ink-soft);
    font-size:15px;
    background:var(--card);
    border-radius:24px;
    box-shadow:var(--float);
  }
  .card-actions{display:flex;gap:8px;margin-top:auto;}
  .btn-whats{
    flex:1;
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--teal-deep);
    color:#fff;
    text-decoration:none;
    font-size:13.5px;
    font-weight:600;
    padding:13px 14px;
    border-radius:var(--r-sm);
    white-space:nowrap;
    transition:background .15s ease;
  }
  .btn-whats .icon{width:17px;height:17px;}
  .btn-whats:hover{background:var(--teal);}
  .btn-link{
    display:flex;align-items:center;justify-content:center;
    width:46px;flex-shrink:0;
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    color:var(--ink-soft);
    text-decoration:none;
    transition:border-color .15s ease, color .15s ease;
  }
  .btn-link:hover{border-color:var(--teal);color:var(--teal);}
  button.btn-link{background:transparent;cursor:pointer;font:inherit;}

  /* JANELA DE OPÇÕES (Google, Instagram, compartilhar) */
  .sheet-overlay{
    position:fixed;inset:0;
    background:rgba(10,30,24,.45);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
    display:none;
    align-items:center;justify-content:center;
    padding:24px 20px;
    z-index:120;
  }
  .sheet-overlay.open{display:flex;animation:fadeOverlay .18s ease both;}
  .sheet{
    background:var(--card);
    border-radius:24px;
    width:100%;max-width:400px;
    padding:22px 14px 14px;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.45);
    animation:modalIn .24s cubic-bezier(.2,.7,.2,1) both;
  }
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:0 8px 16px;}
  .sheet-title{
    font-family:'Urbanist',system-ui,sans-serif;
    font-size:20px;font-weight:600;letter-spacing:-0.01em;line-height:1.2;
    color:var(--ink);
  }
  .sheet-sub{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .sheet-close{
    width:34px;height:34px;flex-shrink:0;
    border-radius:50%;border:none;
    background:var(--cream);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .sheet-close .icon{width:15px;height:15px;stroke-width:2.2;}
  .sheet-close:hover{background:var(--line);}
  .sheet-option{
    width:100%;
    display:flex;align-items:center;gap:14px;
    padding:12px 10px;
    border:none;background:none;
    border-radius:16px;
    text-align:left;text-decoration:none;
    font:inherit;color:var(--ink);
    cursor:pointer;
    transition:background .15s ease;
  }
  .sheet-option + .sheet-option{margin-top:2px;}
  .sheet-option:hover{background:var(--cream);}
  .sheet-option-icon{
    width:44px;height:44px;flex-shrink:0;
    border-radius:14px;
    background:var(--teal-pale);color:var(--teal-deep);
    display:flex;align-items:center;justify-content:center;
  }
  .sheet-option-icon .icon{width:20px;height:20px;}
  .sheet-option-text{flex:1;min-width:0;}
  .sheet-option-title{display:block;font-size:15px;font-weight:600;}
  .sheet-option-desc{display:block;font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sheet-option-arrow{color:var(--ink-soft);display:flex;}
  .sheet-option-arrow .icon{width:16px;height:16px;}
  .sheet-option.done .sheet-option-icon{background:var(--teal-deep);color:#fff;}
  .sheet-option.done .sheet-option-desc{color:var(--teal);font-weight:600;}
  .sheet-option[aria-disabled="true"]{cursor:default;opacity:.5;}
  .sheet-option[aria-disabled="true"]:hover{background:none;}

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(10,30,24,.5);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    overflow-y:auto;
    z-index:100;
  }
  .modal-overlay.open{display:flex;animation:fadeOverlay .2s ease both;}
  @keyframes fadeOverlay{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--card);
    border-radius:var(--r-lg);
    max-width:560px;
    width:100%;
    margin:auto;
    overflow:hidden;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.45);
    animation:modalIn .28s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes modalIn{
    from{opacity:0;transform:translateY(14px) scale(.98);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  .modal-media{
    width:100%;
    aspect-ratio:16/10;
    background:var(--teal-pale);
    display:flex;align-items:center;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .modal-media img{width:100%;height:100%;object-fit:cover;object-position:center 15%;}
  .modal-media .avatar-fallback{font-size:84px;}
  .modal-close{
    position:absolute;top:14px;right:14px;
    width:38px;height:38px;
    border-radius:50%;
    background:rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    color:var(--ink);
    border:none;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
  }
  .modal-close .icon{width:16px;height:16px;stroke-width:2.2;}
  .modal-close:hover{background:#fff;}
  .modal-body{padding:28px 32px 32px;}
  .modal-category{
    display:inline-block;
    font-size:12px;font-weight:600;
    color:var(--teal-deep);
    background:var(--teal-pale);
    padding:5px 12px;border-radius:100px;
  }
  .modal-name{
    font-family:'Urbanist',system-ui,sans-serif;
    font-size:34px;font-weight:600;
    line-height:1.08;
    letter-spacing:-0.02em;
    color:var(--ink);
    margin:14px 0 14px;
  }
  .modal-desc{
    font-size:15.5px;line-height:1.7;
    color:var(--ink);
    margin-bottom:18px;
  }
  .modal-body .card-tags{margin-bottom:22px;}
  .modal-meta{
    display:flex;flex-direction:column;gap:12px;
    padding:18px 20px;
    background:var(--cream);
    border-radius:var(--r-sm);
    margin-bottom:22px;
  }
  .meta-row{
    display:grid;grid-template-columns:96px 1fr;gap:12px;
    font-size:14px;
    color:var(--ink);
  }
  .meta-row strong{color:var(--ink-soft);font-weight:500;}
  .modal-actions{display:flex;gap:10px;}
  .meta-enderecos{display:flex;flex-direction:column;gap:12px;}
  .meta-endereco{display:flex;flex-direction:column;gap:2px;}
  /* Endereço escrito abre o Google Maps */
  .link-maps{
    color:inherit;text-decoration:underline;text-decoration-color:var(--line);
    text-decoration-thickness:1.5px;text-underline-offset:3px;transition:color .15s,text-decoration-color .15s;
  }
  .link-maps:hover,.link-maps:active{color:var(--teal);text-decoration-color:var(--teal);}
  .meta-endereco b{font-weight:600;color:var(--ink);}
  .modal-actions .btn-whats{padding:15px 14px;font-size:14.5px;}
  .modal-actions .btn-link{width:52px;}

  footer{
    border-top:1px solid var(--line);
    padding:32px 0 40px;
    text-align:center;
    font-size:13px;

// ---------- Convênios e formato de atendimento ----------
// convenios: lista de planos aceitos; lista vazia = só particular; campo ausente = não informado
// particular:true = atende particular além dos convênios (aparece como campinho próprio)
// atendimento: "presencial" | "online" | "ambos"
function textoConvenios(p, max){
  if(!Array.isArray(p.convenios)) return '';
  if(!p.convenios.length) return 'Particular';
  const lista = p.convenios.slice(0, max);
  const resto = p.convenios.length - lista.length;
  return lista.join(', ') + (resto > 0 ? ` +${resto}` : '');
}
function textoAtendimento(p){
  return {presencial:'Presencial', online:'Online', ambos:'Presencial e online'}[p.atendimento] || '';
}
function infoCard(p){
  const part = p.particular === true;
  const conv = (part && Array.isArray(p.convenios) && !p.convenios.length) ? '' : textoConvenios(p, part ? 1 : 2);
  const modo = textoAtendimento(p);
  if(!conv && !modo && !part) return '';
  return `<div class="card-info">
    ${part ? `<span class="card-conv card-conv-part"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="18" height="12" rx="2.5"/><path d="M3 10h18"/><path d="M7 15h3"/></svg><span>Particular</span></span>` : ''}
    ${conv ? `<span class="card-conv">${ICON.escudo}<span>${conv}</span></span>` : ''}
    ${modo ? `<span class="card-online">${p.atendimento === 'presencial' ? ICON.consultorio : ICON.video}${modo}</span>` : ''}
  </div>`;
}

// Fórmula de Haversine: calcula distância em km entre duas coordenadas
function calcularDistanciaKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

// Configura um seletor genérico: retorna funções pra renderizar e ligar eventos
function setupSelector({wrapId, btnId, labelId, dropdownId, placeholder, todasLabel, opcoesFn, getValor, setValor, topoHtml, onTopo, aoEscolher}){
  const wrap = document.getElementById(wrapId);
  const btn = document.getElementById(btnId);
  const label = document.getElementById(labelId);
  const dropdown = document.getElementById(dropdownId);
  let aberto = false;

  function renderOptions(){
    const valorAtual = getValor();
    const opcoes = [{nome:todasLabel, valor:null}, ...opcoesFn().map(v => ({nome:v, valor:v}))];
    dropdown.innerHTML = (topoHtml ? topoHtml() : '') + opcoes.map(o => `
      <div class="selector-option ${valorAtual===o.valor ? 'active' : ''}" data-valor="${o.valor ?? ''}">
        <span>${o.nome}</span>
      </div>
    `).join('');

    dropdown.querySelectorAll('.selector-option').forEach(opt => {
      opt.addEventListener('click', () => {
        setValor(opt.dataset.valor || null);
        aberto = false;
        wrap.classList.remove('open');
        const novoValor = getValor();
        label.textContent = novoValor || placeholder;
        label.classList.toggle('placeholder', !novoValor);
        if(aoEscolher) aoEscolher(novoValor);
        renderOptions();
        render();
      });
    });
    const topo = dropdown.querySelector('[data-topo]');
    if(topo && onTopo) topo.addEventListener('click', () => {
      aberto = false;
      wrap.classList.remove('open');
      onTopo();
    });
  }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    aberto = !aberto;
    wrap.classList.toggle('open', aberto);
    btn.setAttribute('aria-expanded', aberto);
  });
  btn.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); btn.click(); }
  });

  document.addEventListener('click', (e) => {
    if(!wrap.contains(e.target)){
      aberto = false;
      wrap.classList.remove('open');
    }
  });

  renderOptions();
  return { renderOptions };
}

// Remove acentos para comparação (ex: "hipertensão" e "hipertensao" ficam iguais na busca)
function removerAcentos(texto){
  return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

// Mede quantas edições (trocar/adicionar/remover letra) separam duas palavras —
// usado para tolerar pequenos erros de digitação na busca (distância de Levenshtein)
function distanciaEdicao(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  for(let i = 0; i <= m; i++) dp[i][0] = i;
  for(let j = 0; j <= n; j++) dp[0][j] = j;
  for(let i = 1; i <= m; i++){
    for(let j = 1; j <= n; j++){
      if(a[i-1] === b[j-1]){
        dp[i][j] = dp[i-1][j-1];
      } else {
        dp[i][j] = 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
      }
    }
  }
  return dp[m][n];
}

// Verifica se o termo buscado "combina" com uma tag, tolerando acento e pequenos erros de digitação.
// A tolerância de erro cresce com o tamanho da palavra (não faz sentido tolerar 2 erros numa palavra de 3 letras).
function combinaComTolerancia(textoTag, termoBusca){
  const tagNormalizada = removerAcentos(textoTag.toLowerCase());
  const buscaNorm = removerAcentos(termoBusca.toLowerCase());

  // Match direto (substring) — caso mais comum, cobre buscas parciais como "cardio"
  if(tagNormalizada.includes(buscaNorm)) return true;

  // Para termos de busca muito curtos (1-2 letras), não vale a pena tolerar erro —
  // geraria falsos positivos demais
  if(buscaNorm.length < 3) return false;

  // Compara o termo buscado com cada palavra da tag, tolerando pequenos erros de digitação
  const tolerancia = buscaNorm.length <= 5 ? 1 : 2;
  const palavrasDaTag = tagNormalizada.split(/\s+/);
  return palavrasDaTag.some(palavra => distanciaEdicao(palavra, buscaNorm) <= tolerancia);
}

  'angiologia':     { nome:'Angiologista', extras:['vascular'] },
};

function chaveEspecialidade(categoria){
  return removerAcentos(categoria.toLowerCase()).trim();
}
function nomeProfissao(categoria){
  const chave = chaveEspecialidade(categoria);
  if(PROFISSOES[chave]) return PROFISSOES[chave].nome;
  if(chave.endsWith('logia')) return categoria.slice(0, -1) + 'sta'; // Neurologia → Neurologista
  return categoria;
}
// Todas as palavras que levam a uma especialidade
function termosDaEspecialidade(categoria){
  const chave = chaveEspecialidade(categoria);
  const termos = [chave, removerAcentos(nomeProfissao(categoria).toLowerCase()).replace(/\(a\)/, '')];
  if(chave.endsWith('logia')){
    const raiz = chave.slice(0, -2);              // cardiolo
    termos.push(raiz + 'gista', raiz + 'go', raiz + 'ga');
  }
  if(PROFISSOES[chave]) termos.push(...PROFISSOES[chave].extras);
  return [...new Set(termos)];
}
function combinaComProfissional(p, termo){
  const combinaPalavra = (w) =>
    p.tags.some(t => combinaComTolerancia(t, w)) ||
    termosDaEspecialidade(p.categoria).some(t => combinaComTolerancia(t, w));
  if(combinaPalavra(termo)) return true;
  // Frases como "nutricionista esportiva": cada palavra precisa combinar com a especialidade ou um serviço
  const palavras = palavrasDaBusca(termo);
  return palavras.length > 1 && palavras.every(combinaPalavra);
}

// Separa a busca em palavras, ignorando ligações curtas como "de", "do", "em"
function palavrasDaBusca(termo){
  return termo.toLowerCase().split(/[\s·,]+/).filter(w => w.length >= 3);
}

function dicaDaEtapa(grupoDicas, esp, posicao){
  if(grupoDicas && grupoDicas[esp]) return grupoDicas[esp];
  if(posicao === 0) return 'Comece por aqui';
  return DICAS_ESPECIALIDADE[chaveQueixa(esp)] || 'Se continuar ou voltar';
}

// Algumas especialidades aparecem com nomes diferentes no cadastro
const EQUIVALENTES = {
  'clinica medica':'clinica geral', 'clinico geral':'clinica geral', 'medicina de familia':'clinica geral', 'medicina da familia':'clinica geral',
  'ginecologia e obstetricia':'ginecologia', 'obstetricia':'ginecologia', 'alergia e imunologia':'alergologia',
  'proctologia':'coloproctologia', 'otorrino':'otorrinolaringologia', 'vascular':'angiologia', 'cirurgia vascular':'angiologia',
};
function chaveQueixa(categoria){
  const k = chaveEspecialidade(categoria);
  return EQUIVALENTES[k] || k;
}

// Palavras de ligação são ignoradas: "dor de cabeça" e "dor na cabeça" viram a mesma coisa
const PALAVRAS_LIGACAO = new Set(['de','da','do','das','dos','na','no','nas','nos','em','a','o','as','os','e','um','uma','com','minha','meu','pra','para','to','ta','esta','estou']);
// Palavras comuns que se parecem com queixas e nunca devem ser lidas como erro de digitação delas
const NAO_CONFUNDIR = new Set(['gente','agente','casado','casada','pressa','vagina','vaginal','casas','olha','olhar','cortei']);
function tokensQueixa(texto){
  return removerAcentos(texto.toLowerCase()).replace(/[^a-z0-9]+/g, ' ').trim().split(/\s+/)
    .filter(w => w && !PALAVRAS_LIGACAO.has(w));
}
// Palavras curtas precisam ser exatas; nas longas aceitamos erro de digitação
// Devolve 1 para palavra exata, 0.7 para erro de digitação, 0 se não combina
function palavraParecida(a, b){
  if(a === b) return 1;
  if(NAO_CONFUNDIR.has(a)) return 0;
  const tol = b.length <= 5 ? 0 : b.length <= 8 ? 1 : 2;
  return tol > 0 && Math.abs(a.length - b.length) <= tol && distanciaEdicao(a, b) <= tol ? 0.7 : 0;
}
// Procura a expressão em sequência no texto; devolve a pontuação do melhor trecho (0 se não achou)
function contemExpressao(tokens, expr){
  let melhor = 0;
  if(!expr.length || expr.length > tokens.length) return 0;
  for(let i = 0; i + expr.length <= tokens.length; i++){
    let soma = 0;
    for(let k = 0; k < expr.length; k++){
      const n = palavraParecida(tokens[i + k], expr[k]);
      if(!n){ soma = 0; break; }
      soma += n;
    }
    if(soma > melhor) melhor = soma;
  }
  return melhor;
}
// Pré-processa as listas uma vez só
const _prep = lista => lista.map(g => ({ ...g, _exprs: g.palavras.map(tokensQueixa).filter(e => e.length) }));
const SINTOMAS_PREP = _prep(SINTOMAS);
const EMERGENCIAS_PREP = _prep(EMERGENCIAS);

// Lê o que a pessoa escreveu e devolve: emergência, queixa reconhecida ou nada
function lerQueixa(texto){
  const tokens = tokensQueixa(texto || '');
  if(!tokens.length) return null;
  for(const e of EMERGENCIAS_PREP){
    if(e._exprs.some(expr => contemExpressao(tokens, expr))){
      return e.tipo === 'emocional'
        ? { emergencia:'emocional', especialidades:['Psicologia','Psiquiatria'] }
        : { emergencia:'fisica', especialidades:[] };
    }
  }
  const pontuados = SINTOMAS_PREP.map(g => ({
    g, pontos: g._exprs.reduce((s, expr) => s + contemExpressao(tokens, expr), 0)
  })).filter(x => x.pontos > 0).sort((a, b) => b.pontos - a.pontos);
  if(!pontuados.length) return null;
  // Se duas queixas empatam ("meu filho com dor de dente"), juntamos as duas
  const grupos = pontuados.filter(x => x.pontos === pontuados[0].pontos).slice(0, 2).map(x => x.g);
  const especialidades = [...new Set(grupos.flatMap(g => g.especialidades))];
  const dicas = Object.assign({}, ...grupos.map(g => g.dicas || {}));
  return { rotulo: grupos.map(g => g.rotulo).join(' e '), especialidades, dicas };
}

// Posição da especialidade na indicação (para ordenar os cards); quem não está na lista vai depois
function prioridadeNaQueixa(queixa, categoria){
  if(!queixa) return 0;
  const i = queixa.especialidades.map(chaveQueixa).indexOf(chaveQueixa(categoria));
  return i === -1 ? 99 : i;
}
function profissionaisDaEspecialidade(esp){
  return profissionais.filter(p => chaveQueixa(p.categoria) === chaveQueixa(esp));
}

// Quando a pessoa escolhe uma sugestão, filtramos exatamente aquele recorte (especialidade + serviço)
let filtroSugestao = null;

function render(){
  atualizarEstadoBusca();
  const buscaNormalizada = buscaTag.trim().toLowerCase();
  // Lê a busca como queixa ("dor nas costas") só quando a pessoa não escolheu uma sugestão exata
  // Contar o que sente é coisa do chat: aqui a busca só reage a sinais de emergência (por segurança)
  // e, se a pessoa descrever um sintoma, convida para o chat
  const queixaLida = filtroSugestao ? null : lerQueixa(buscaTag);
  const queixa = queixaLida && queixaLida.emergencia ? queixaLida : null;
  const sintomaParaChat = queixaLida && !queixaLida.emergencia ? queixaLida : null;
  const especialidadesQueixa = queixa ? queixa.especialidades.map(chaveQueixa) : [];
  // Quando a localização está ativa, o filtro de cidade não restringe a lista —
  // mostramos todos os profissionais ordenados por proximidade, mesmo os de outras cidades,
  // para nunca deixar a busca vazia por causa de um filtro de cidade rígido.
  let filtrados = profissionais.filter(p =>
    (!categoriaAtiva || p.categoria === categoriaAtiva) &&
    (!cidadeAtiva || p.locais.some(l => l.cidade === cidadeAtiva)) &&
    (filtroSugestao
      ? p.categoria === filtroSugestao.categoria && (!filtroSugestao.tag || p.tags.some(t => t.toLowerCase() === filtroSugestao.tag))
      : (!buscaNormalizada || combinaComProfissional(p, buscaNormalizada) || especialidadesQueixa.includes(chaveQueixa(p.categoria))))
  );
  // O botão de especialidade acompanha a busca: se tudo que apareceu é de uma especialidade só, ela aparece lá
  if(categoriaAtiva || !buscaNormalizada) categoriaDaBusca = null;
  else if(filtroSugestao) categoriaDaBusca = filtroSugestao.categoria;
  else {
    const cats = [...new Set(filtrados.map(p => p.categoria))];
    categoriaDaBusca = cats.length === 1 ? cats[0] : null;
  }
  atualizarRotuloEspecialidade();

  // Em sinal de emergência física, não mostramos profissionais: a orientação é buscar atendimento já
  if(queixa && queixa.emergencia === 'fisica') filtrados = [];

  // Se a localização foi usada, ordena por proximidade (mais perto primeiro)
  // Com queixa reconhecida, a especialidade mais indicada vem primeiro (e, dentro dela, quem está mais perto)
  if(localizacaoUsuario || queixa){
    filtrados = filtrados.slice().sort((a, b) => {
      const prio = prioridadeNaQueixa(queixa, a.categoria) - prioridadeNaQueixa(queixa, b.categoria);
      if(prio) return prio;
      if(!localizacaoUsuario) return 0;
      const distA = distanciasPorProfissional[profissionais.indexOf(a)] ?? Infinity;
      const distB = distanciasPorProfissional[profissionais.indexOf(b)] ?? Infinity;
      return distA - distB;
    });
  }

  renderOrientacao(queixa);
  if(!queixa && sintomaParaChat) renderConviteChat(sintomaParaChat);
  // Sintoma sem nenhum profissional correspondente na busca: o convite para o chat já basta
  if(sintomaParaChat && !filtrados.length){
    countEl.innerHTML = '';
    gridEl.innerHTML = '';
    return;
  }
  renderAvisoLocal(!!buscaNormalizada || !!categoriaAtiva);
  if(queixa && queixa.emergencia === 'fisica'){
    countEl.innerHTML = '';
    gridEl.innerHTML = '';
    return;
  }

  if(queixa && filtrados.length){
    const titulo = queixa.emergencia === 'emocional' ? 'Quem pode te acompanhar' : localizacaoUsuario ? 'Quem atende perto de você' : 'Quem pode te atender';
    countEl.innerHTML = `<span class="secao-titulo">${titulo}</span><span class="secao-qtd">${filtrados.length} ${filtrados.length!==1?'profissionais':'profissional'}</span>`;
  } else if(queixa){
    countEl.innerHTML = '';
  } else {
    const semCadastroAqui = localizacaoUsuario && cidadePerto && !cidadeAtiva && cidadeUsuario && !cidadeTemCadastro(cidadeUsuario);
    countEl.innerHTML = `<strong>${filtrados.length}</strong> ${filtrados.length!==1?'profissionais':'profissional'} encontrado${filtrados.length!==1?'s':''}`
      + (semCadastroAqui && filtrados.length ? `<span class="aviso-cidade">Ainda não temos profissionais em ${cidadeUsuario}. Mostrando os mais próximos.</span>` : '');
  }

  gridEl.innerHTML = filtrados.length ? filtrados.map((p, i) => {
    const idx = profissionais.indexOf(p);
    const distancia = distanciasPorProfissional[idx];
    return `
    <div class="card" data-idx="${idx}" tabindex="0" role="button" aria-label="Ver perfil de ${p.nome}" style="animation-delay:${Math.min(i,8)*45}ms">
      <div class="card-media">
        ${p.foto ? `<img src="${p.foto}" alt="Foto de ${p.nome}" loading="lazy">` : `<span class="avatar-fallback">${iniciais(p.nome)}</span>`}
        <span class="card-chip">${p.categoria}</span>
      </div>
      <div class="card-body">
        <div class="card-name">${p.nome}</div>
        <div class="card-category">${ICON.pin}<span>${textoCidades(p, idx)}</span>${distancia !== undefined ? `<span class="card-distance">${formatarDistancia(distancia)} de você</span>` : ''}</div>
        ${infoCard(p)}
        <div class="card-desc">${p.desc}</div>
        <div class="card-tags">${p.tags.map(t => `<span class="tag-pill">#${t}</span>`).join('')}</div>
        <div class="card-actions">
          <a class="btn-whats" href="https://wa.me/${p.whats}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${ICON.chat}Chamar no WhatsApp</a>
          <button type="button" class="btn-link" data-acoes="${idx}" title="Mais opções" aria-label="Mais opções: Google, Instagram e compartilhar">${ICON.more}</button>
        </div>
      </div>
    </div>
  `;
  }).join('') : `<div class="empty-state">${queixa
      ? 'Ainda não temos essa especialidade cadastrada por aqui. Enquanto isso, um clínico geral ou a UBS do seu bairro podem te atender.'
      : 'Nenhum profissional encontrado com esses filtros.'}</div>`;

  gridEl.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => abrirModal(profissionais[card.dataset.idx]));
    card.addEventListener('keydown', (e) => {
      if(e.target !== card) return; // teclas nos botões internos não abrem o perfil
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); abrirModal(profissionais[card.dataset.idx]); }
    });
  });
  ligarBotoesAcoes(gridEl);
}

// ---------- Orientação acima dos resultados quando a busca é uma queixa ----------
const orientacaoEl = document.getElementById('orientacao');

function renderOrientacao(queixa){
  if(!queixa){ orientacaoEl.hidden = true; orientacaoEl.innerHTML = ''; return; }
  orientacaoEl.hidden = false;

  if(queixa.emergencia === 'fisica'){
    orientacaoEl.className = 'orientacao orientacao-urgente';
    orientacaoEl.innerHTML = `
      <div class="orientacao-icone">${ICON.alerta}</div>
      <div class="orientacao-corpo">
        <h2 class="orientacao-titulo">Isso pode ser uma emergência</h2>
        <p>Não espere por uma consulta. Ligue para o SAMU ou vá agora ao pronto-socorro mais próximo.</p>
        <div class="orientacao-acoes">
          <a class="orientacao-btn" href="tel:192">${ICON.phone}Ligar para o SAMU (192)</a>
        </div>
      </div>`;
    return;
  }

  if(queixa.emergencia === 'emocional'){
    orientacaoEl.className = 'orientacao orientacao-acolhe';
    orientacaoEl.innerHTML = `
      <div class="orientacao-icone">${ICON.pulse}</div>
      <div class="orientacao-corpo">
        <h2 class="orientacao-titulo">Você não precisa passar por isso sozinho</h2>
        <p>O CVV conversa com você agora, 24 horas por dia, de graça. Se houver risco imediato, ligue para o SAMU (192).</p>
        <div class="orientacao-acoes">
          <a class="orientacao-btn" href="tel:188">${ICON.phone}Ligar para o CVV (188)</a>
          <a class="orientacao-btn orientacao-btn-sec" href="https://cvv.org.br" target="_blank" rel="noopener">Conversar pelo chat</a>
        </div>
      </div>`;
    return;
  }

  const etapas = queixa.especialidades.map((esp, i) => {
    const n = profissionaisDaEspecialidade(esp).length;
    const nome = nomeProfissao(esp).replace('(a)', '');
    const dica = dicaDaEtapa(queixa.dicas, esp, i);
    const conteudo = `
      <span class="etapa-num">${i + 1}</span>
      <span class="etapa-texto"><span class="etapa-nome">${nome}</span><span class="etapa-dica">${dica}</span></span>
      <span class="etapa-qtd${n ? '' : ' etapa-qtd-vazia'}">${n ? `${n} ${n === 1 ? 'profissional' : 'profissionais'}` : 'Em breve'}</span>`;
    return n
      ? `<button type="button" class="etapa" data-esp="${esp}" aria-label="Ver ${nome}">${conteudo}</button>`
      : `<div class="etapa etapa-vazia">${conteudo}</div>`;
  }).join('');

  orientacaoEl.className = 'orientacao orientacao-caminho';
  orientacaoEl.innerHTML = `
    <p class="caminho-contou">Você contou: <span>${escaparHtml(buscaTag.trim())}</span> <button type="button" class="caminho-trocar" id="caminhoTrocar">Trocar</button></p>
    <div class="caminho-bloco">
      <h2 class="orientacao-titulo">O caminho indicado</h2>
      <div class="etapas">${etapas}</div>
      <p class="orientacao-nota">É um ponto de partida, não um diagnóstico. Se piorar ou não passar, procure atendimento.</p>
    </div>`;

  document.getElementById('caminhoTrocar').addEventListener('click', () => {
    tagSearchInput.focus();
    tagSearchInput.select();
  });
  orientacaoEl.querySelectorAll('.etapa[data-esp]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = profissionaisDaEspecialidade(btn.dataset.esp)[0].categoria;
      aplicarBusca(nomeProfissao(cat).replace('(a)', ''), { categoria:cat, tag:null });
    });
  });
}

function escaparHtml(t){
  return t.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fecharModal(){
  modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
  if(location.hash) atualizarEndereco(location.pathname + location.search);
}

// ---------- Link próprio de cada profissional ----------
// Ex: .../saude-digital.html#isabela-padovan-castilho  → abre o perfil direto
function slugProfissional(p){
  return removerAcentos(p.nome.toLowerCase()).replace(/^dra?\.\s*/, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}
// Endereço público do site, usado quando a página não está rodando nele
// (ex: pré-visualização do Claude ou arquivo aberto direto do computador)
const SITE_URL = 'https://pauloponto.github.io/suasaudedigital/';

// O link compartilhado sempre aponta para o site oficial. Antes, se a página fosse aberta
// por outro endereço (Google Drive, pré-visualização), o link levava para lá.
function estaNoSite(){
  return location.hostname === new URL(SITE_URL).hostname;
}
function linkProfissional(p){
  const base = estaNoSite() ? location.origin + location.pathname : SITE_URL;
  return base + '#' + slugProfissional(p);
}
// Troca o endereço na barra sem recarregar; ambientes isolados bloqueiam isso, então só ignoramos
function atualizarEndereco(url){
  try{ history.replaceState(null, '', url); }catch(_){}
}
function abrirPorLink(){
  const slug = decodeURIComponent(location.hash.slice(1));
  if(!slug) return;
  // link "index.html#conversar" (usado na página Como funciona) abre o chat direto
  if(slug === 'conversar'){ abrirChat(); return; }
  const p = profissionais.find(x => slugProfissional(x) === slug);
  if(p) abrirModal(p);
}
window.addEventListener('hashchange', abrirPorLink);

  // aceita "usuario", "@usuario" ou o link completo do perfil
  return (valor || '').trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/^@/, '').replace(/[/?#].*$/, '');
}

async function compartilharPerfil(p, podeCompartilhar){
  const url = linkProfissional(p);
  if(podeCompartilhar){
    try{
      await navigator.share({
        title: `${p.nome} — Sua Saúde`,
        text: `${p.nome}, ${p.categoria} em ${listaCidades(p)}. Encontrei no Sua Saúde:`,
        url,
      });
      return;
    }catch(err){
      if(err && err.name === 'AbortError') return; // a pessoa fechou a janela de compartilhar
      // se o compartilhamento falhar por outro motivo, copia o link
    }
  }
  const copiou = await copiarTexto(url);
  const btn = document.getElementById('sheetShare');
  const desc = document.getElementById('sheetShareDesc');
  if(!btn || !desc) return;
  btn.classList.toggle('done', copiou);
  desc.textContent = copiou ? 'Link copiado! Agora é só colar.' : url;
}

async function copiarTexto(texto){
  try{
    await navigator.clipboard.writeText(texto);
    return true;
  }catch(_){
    // alternativa para navegadores sem acesso à área de transferência
    const campo = document.createElement('textarea');
    campo.value = texto;
    campo.style.position = 'fixed'; campo.style.opacity = '0';
    document.body.appendChild(campo);
    campo.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(__){}
    campo.remove();
    return ok;
  }
}

sheetOverlay.addEventListener('click', (e) => {
  if(e.target === sheetOverlay) fecharAcoes();
});

// ---------- Celular: arrastar o card para baixo fecha (como nos apps) ----------
// Só começa quando o card está no topo da rolagem e o dedo desce; senão, a rolagem normal continua.
(function arrastarParaFechar(){
  const modal = document.getElementById('modalContent');
  let inicioY = 0, inicioT = 0, dy = 0, arrastando = false, podeArrastar = false;
  const ehFolha = () => matchMedia('(max-width: 560px)').matches;
  modal.addEventListener('touchstart', (e) => {
    if(!ehFolha() || e.touches.length !== 1) return;
    podeArrastar = modal.scrollTop <= 0;
    arrastando = false; dy = 0;
    inicioY = e.touches[0].clientY; inicioT = Date.now();
  }, {passive:true});
  modal.addEventListener('touchmove', (e) => {
    if(!podeArrastar) return;
    const d = e.touches[0].clientY - inicioY;
    if(!arrastando){
      if(d > 6 && modal.scrollTop <= 0){ arrastando = true; modal.style.animation = 'none'; modal.style.transition = 'none'; }
      else if(d < -6){ podeArrastar = false; return; }
      else return;
    }
    e.preventDefault();
    dy = Math.max(0, d);
    modal.style.transform = `translateY(${dy}px)`;
    const resta = Math.max(0, 1 - dy / Math.max(240, modal.offsetHeight * 0.8)); // 1 = aberto, 0 = fechado
    modalOverlay.style.backgroundColor = `rgba(10,30,24,${(.5 * resta).toFixed(3)})`;
    const desfoque = `blur(${(6 * resta).toFixed(2)}px)`;
    modalOverlay.style.webkitBackdropFilter = desfoque; modalOverlay.style.backdropFilter = desfoque;
  }, {passive:false});
  const soltar = () => {
    if(!arrastando){ podeArrastar = false; return; }
    arrastando = false; podeArrastar = false;
    const velocidade = dy / Math.max(1, Date.now() - inicioT);
    const fechar = dy > Math.min(140, modal.offsetHeight * 0.25) || velocidade > 0.6;
    modal.style.transition = 'transform .22s cubic-bezier(.2,.7,.2,1)';
    modalOverlay.style.transition = 'background-color .22s, backdrop-filter .22s, -webkit-backdrop-filter .22s';
    if(fechar){
      modal.style.transform = `translateY(${modal.offsetHeight + 40}px)`;
      modalOverlay.style.backgroundColor = 'rgba(10,30,24,0)';
      modalOverlay.style.webkitBackdropFilter = 'blur(0px)'; modalOverlay.style.backdropFilter = 'blur(0px)';
      setTimeout(() => { fecharModal(); limpar(); }, 220);
    } else {

function aplicarBusca(texto, filtro = null){

// Nome curto para combinar com o serviço: "nutrição comportamental" → "Nutricionista comportamental"
function rotuloSugestao(categoria, tag){
  const prof = nomeProfissao(categoria);
  if(!tag) return { html:`<strong>${prof}</strong>`, texto:prof.replace('(a)', '') };
  const palavras = tag.split(/\s+/);
  const primeira = removerAcentos(palavras[0].toLowerCase());
  const chave = chaveEspecialidade(categoria);
  if(palavras.length > 1 && primeira.slice(0, 5) === chave.slice(0, 5)){
    const resto = palavras.slice(1).join(' ');
    return { html:`<strong>${prof}</strong> ${resto}`, texto:`${prof.replace('(a)', '')} ${resto}` };
  }
  return { html:`<strong>${prof}</strong> · ${tag}`, texto:`${prof.replace('(a)', '')} · ${tag}` };
}

// Todas as combinações possíveis com os profissionais que existem hoje:
// a especialidade inteira + especialidade com cada serviço oferecido
function todasAsCombinacoes(){
  const lista = [];
  categorias.forEach(cat => {
    const daCategoria = profissionais.filter(p => p.categoria === cat);
    lista.push({ categoria:cat, tag:null, total:daCategoria.length });
    const contagem = {};
    daCategoria.forEach(p => p.tags.forEach(t => {
      const k = t.toLowerCase();
      contagem[k] = (contagem[k] || 0) + 1;
    }));
    Object.entries(contagem).forEach(([tag, n]) => lista.push({ categoria:cat, tag, total:n }));
  });
  return lista;
}

const LIMITE_SUGESTOES = 7;

function montarSugestoes(){
  const termo = tagSearchInput.value.trim();
  const palavras = palavrasDaBusca(termo);
  if(termo.length < 2){ sugestoesAtuais = []; return; }

  // Cada palavra digitada precisa combinar com a especialidade ou com o serviço da sugestão.
  // A última palavra pode estar pela metade ("nutricionista esp"), então ela vale a partir de 2 letras.
  const tokens = palavras.length ? palavras : [termo.toLowerCase()];
  const ultima = termo.toLowerCase().split(/\s+/).pop();
  if(ultima.length === 2 && !tokens.includes(ultima)) tokens.push(ultima);

  const combinaCategoria = (cat, w) => termosDaEspecialidade(cat).some(t => combinaComTolerancia(t, w));
  const combinaTag = (tag, w) => !!tag && combinaComTolerancia(tag, w);

  sugestoesAtuais = todasAsCombinacoes()
    .map(c => ({ ...c, ...rotuloSugestao(c.categoria, c.tag) }))
    .map(c => {
      let pelaCategoria = 0, peloServico = 0;
      const ok = tokens.every(w => {
        if(combinaCategoria(c.categoria, w)){ pelaCategoria++; return true; }
        if(combinaTag(c.tag, w)){ peloServico++; return true; }
        return false;
      });
      return ok ? { ...c, pelaCategoria, peloServico } : null;
    })
    .filter(Boolean)
    // quem digitou a profissão vê primeiro a especialidade inteira; quem digitou o serviço vê o serviço
    .sort((a, b) =>
      (b.peloServico - a.peloServico) ||
      ((a.tag ? 1 : 0) - (b.tag ? 1 : 0)) ||
      ((a.texto.includes('·') ? 1 : 0) - (b.texto.includes('·') ? 1 : 0)) || // "Nutricionista esportiva" antes de "Nutricionista · hipertrofia"
      (b.total - a.total) ||
      (a.tag || '').localeCompare(b.tag || ''))
    .slice(0, LIMITE_SUGESTOES);

  // Se a busca é uma queixa, a primeira sugestão leva direto para quem atende
  const queixa = lerQueixa(termo);
  if(queixa){
    const total = profissionais.filter(p => queixa.especialidades.map(chaveQueixa).includes(chaveQueixa(p.categoria))).length;
    const item = queixa.emergencia === 'fisica'
      ? { queixa:true, urgente:true, html:'<strong>Pode ser uma emergência</strong>', sub:'Veja o que fazer agora', total:null }
      : queixa.emergencia === 'emocional'
      ? { queixa:true, html:'<strong>Precisa de apoio agora?</strong>', sub:'Veja onde conversar com alguém', total:null }
      : { queixa:true, chat:true, html:`<strong>Contar no chat: ${escaparHtml(termo)}</strong>`,
          sub:'O chat mostra quem costuma atender', total:null };
    sugestoesAtuais = [item, ...sugestoesAtuais].slice(0, LIMITE_SUGESTOES);
  }


  sugestaoAtiva = -1;
  const plural = n => `${n} ${n === 1 ? 'profissional' : 'profissionais'}`;
  sugestoesEl.innerHTML = sugestoesAtuais.map((sg, i) => `
    <div class="sug-item" role="option" id="sug-${i}" data-i="${i}">
      <span class="sug-icon${sg.urgente ? ' sug-icon-urgente' : ''}">${sg.urgente ? ICON.alerta : sg.chat ? ICON.chat : sg.queixa ? ICON.pulse : sg.tag ? ICON.tag : ICON.steth}</span>
      <span class="sug-text"><span class="sug-titulo">${sg.html}</span>${sg.sub ? `<span class="sug-sub">${sg.sub}</span>` : ''}</span>
      ${sg.total === null ? '' : `<span class="sug-count">${plural(sg.total)}</span>`}
    </div>`).join('');

  sugestoesEl.querySelectorAll('.sug-item').forEach(el => {
    el.addEventListener('mousedown', (e) => e.preventDefault()); // mantém o foco no campo
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      escolherSugestao(Number(el.dataset.i));
    });
  });
}

function abrirSugestoes(){
  montarSugestoes();
  const temSugestoes = sugestoesAtuais.length > 0;
  sugestoesEl.classList.toggle('open', temSugestoes);

}
function fecharSugestoes(){
  sugestoesEl.classList.remove('open');

}
function escolherSugestao(i){
  const sg = sugestoesAtuais[i];
  if(!sg) return;
  if(sg.chat){ fecharSugestoes(); abrirChatCom(tagSearchInput.value.trim()); return; }
  if(sg.queixa){
    // Emergência: fecha a lista e leva até o aviso
    fecharSugestoes();
    orientacaoEl.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' });
    return;
  }
  aplicarBusca(sg.texto, { categoria:sg.categoria, tag:sg.tag });
  fecharSugestoes();
}
function destacarSugestao(i){
  const itens = sugestoesEl.querySelectorAll('.sug-item');
  if(!itens.length) return;
  sugestaoAtiva = (i + itens.length) % itens.length;
  itens.forEach((el, k) => el.classList.toggle('ativo', k === sugestaoAtiva));
  itens[sugestaoAtiva].scrollIntoView({ block:'nearest' });
  tagSearchInput.setAttribute('aria-activedescendant', itens[sugestaoAtiva].id);
}

function formatarDistancia(km){
  if(km < 1) return 'menos de 1 km';

// Ao abrir o site já pedimos a localização. Se a pessoa negar, o navegador não deixa pedir de novo:
// nesse caso só explicamos como liberar (cadeado ao lado do endereço do site).
let estadoLocal = navigator.geolocation ? 'desconhecido' : 'indisponivel'; // desconhecido | pedindo | ativo | negado | erro | indisponivel
let avisoLocalDispensado = false; // a pessoa tocou em "Agora não"
const avisoLocalEl = document.getElementById('avisoLocal');
const ICON_CADEADO = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

function atualizarRotuloCidade(){
  const label = document.getElementById('selectorCidadeLabel');
  const wrap = document.getElementById('selectorCidadeWrap');
  const perto = !!localizacaoUsuario && cidadePerto && !cidadeAtiva;
  if(estadoLocal === 'pedindo' && !cidadeAtiva){ label.textContent = 'Localizando…'; label.classList.remove('placeholder'); }
  else if(perto){ label.textContent = cidadeUsuario || 'Perto de você'; label.classList.remove('placeholder'); }
  else { label.textContent = cidadeAtiva || 'Todas'; label.classList.toggle('placeholder', !cidadeAtiva); }
  wrap.classList.toggle('perto', perto);
}

// Descobre o nome da cidade a partir das coordenadas (serviço gratuito, sem chave).
// Se falhar, o botão continua mostrando "Perto de você".
function descobrirCidade({lat, lon}){
  fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=pt`)
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      const nome = d && (d.city || d.locality);
      if(!nome) return;
      cidadeUsuario = nome;
      atualizarRotuloCidade();
      render();
    })
    .catch(() => {});
}
function cidadeTemCadastro(nome){
  const n = removerAcentos(String(nome).toLowerCase());
  return cidades.some(c => removerAcentos(c.toLowerCase()) === n);
}

function pedirLocalizacao(){
  return new Promise(resolve => {
    if(!navigator.geolocation){ estadoLocal = 'indisponivel'; render(); resolve(false); return; }
    estadoLocal = 'pedindo';
    atualizarRotuloCidade();
    navigator.geolocation.getCurrentPosition(
      (position) => {
        localizacaoUsuario = { lat: position.coords.latitude, lon: position.coords.longitude };
        // Distância exata até cada profissional (pelo endereço dele, não só pela cidade)
        // Quem atende em várias cidades conta pelo endereço mais perto
        distanciasPorProfissional = {};
        localMaisPerto = {};
        profissionais.forEach((p, idx) => {
          p.locais.forEach(l => {
            if(l.lat === undefined || l.lon === undefined) return;
            const d = calcularDistanciaKm(localizacaoUsuario.lat, localizacaoUsuario.lon, l.lat, l.lon);
            if(distanciasPorProfissional[idx] === undefined || d < distanciasPorProfissional[idx]){
              distanciasPorProfissional[idx] = d;
              localMaisPerto[idx] = l;
            }
          });
        });
        estadoLocal = 'ativo';
        descobrirCidade(localizacaoUsuario);
        cidadePerto = true;
        cidadeAtiva = null;   // com localização, mostramos todas as cidades ordenadas por distância
        seletorCidade.renderOptions();
        atualizarRotuloCidade();
        render();
        resolve(true);
      },
      (erro) => {
        estadoLocal = erro && erro.code === 1 ? 'negado' : 'erro';
        atualizarRotuloCidade();
        render();
        resolve(false);
      },
      { enableHighAccuracy:false, timeout:15000, maximumAge:600000 }
    );
  });
}

// Aviso acima dos resultados: aparece quando a pessoa já está buscando e ainda não tem localização
function renderAvisoLocal(buscando){
  const mostrar = buscando && !localizacaoUsuario && !avisoLocalDispensado && ['desconhecido','negado','erro'].includes(estadoLocal);
  avisoLocalEl.hidden = !mostrar;
  if(!mostrar){ avisoLocalEl.innerHTML = ''; return; }
  const negado = estadoLocal === 'negado';
  avisoLocalEl.innerHTML = `
    <span class="aviso-local-icone">${negado ? ICON_CADEADO : ICON.locate}</span>
    <p>${negado ? 'Sua localização está bloqueada' : 'Quer ver quem está mais perto de você?'}
      <small>${negado ? 'Para liberar, toque no cadeado ao lado do endereço do site e permita a localização.' : 'Ative a localização e a lista fica ordenada por distância.'}</small></p>
    <button type="button" class="aviso-local-btn" id="avisoLocalBtn">${negado ? 'Já liberei' : 'Ativar localização'}</button>
    <button type="button" class="aviso-local-fechar" id="avisoLocalFechar" aria-label="Agora não">${ICON.close}</button>`;
  document.getElementById('avisoLocalBtn').addEventListener('click', () => pedirLocalizacao());
  document.getElementById('avisoLocalFechar').addEventListener('click', () => { avisoLocalDispensado = true; renderAvisoLocal(false); });
}
