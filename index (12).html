function adicionarBalao(html, quem){
  const el = document.createElement('div');
  el.className = `chat-msg chat-msg-${quem}`;
  el.innerHTML = html;
  chatMsgs.appendChild(el);
  rolarChat();
  return el;
}

// Fala do chat, com um "digitando…" curto para a conversa não parecer instantânea demais
function falar(html, opcoes = {}){
  return new Promise(resolve => {
    const digitando = adicionarBalao('<span class="chat-digitando"><i></i><i></i><i></i></span>', 'bot');
    setTimeout(() => {
      digitando.remove();
      const el = adicionarBalao(html, opcoes.urgente ? 'bot chat-msg-urgente' : 'bot');
      if(opcoes.atalhos) mostrarAtalhos(opcoes.atalhos, opcoes.aoEscolher);
      if(opcoes.depois) opcoes.depois(el);
      rolarChat();
      resolve(el);
    }, semMovimento() ? 0 : 550);
  });
}

function mostrarAtalhos(lista, aoEscolher){
  const wrap = document.createElement('div');
  wrap.className = 'chat-atalhos';
  wrap.innerHTML = lista.map(t => `<button type="button" class="chat-atalho">${t}</button>`).join('');
  wrap.querySelectorAll('.chat-atalho').forEach(btn => {
    btn.addEventListener('click', () => {
      wrap.remove();
      (aoEscolher || receberMensagem)(btn.textContent);
    });
  });
  chatMsgs.appendChild(wrap);
}
function limparAtalhos(){ chatMsgs.querySelectorAll('.chat-atalhos').forEach(a => a.remove()); }

// Envio sem <form>: funciona também em pré-visualizações que bloqueiam formulários
function enviarChat(){
  const texto = chatInput.value.trim();
  if(!texto){ chatInput.focus(); return; }
  chatInput.value = '';
  receberMensagem(texto);
  chatInput.focus();
}
document.getElementById('chatEnviar').addEventListener('click', enviarChat);
chatInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); enviarChat(); }
});

// "É para você ou para outra pessoa?" — muda o texto das perguntas e, para criança, coloca o pediatra no caminho
function lerParaQuem(texto){
  const t = removerAcentos(texto.toLowerCase());
  if(/\b(meu filho|minha filha|meus filhos|filho|filha|crianca|bebe|nenem|neto|neta|enteado|enteada)\b/.test(t)) return 'crianca';
  if(/\b(minha mae|meu pai|minha esposa|meu marido|minha namorada|meu namorado|minha avo|meu avo|amig[oa]|outra pessoa|ela|ele)\b/.test(t)) return 'outro';
  if(/\b(para mim|pra mim|eu mesm[oa]|sou eu|e pra mim|mim)\b/.test(t)) return 'eu';
  return null;
}
function ajustarParaCrianca(queixa){
  if(chatPara !== 'crianca') return queixa;
  const esp = queixa.especialidades.filter(e => chaveQueixa(e) !== 'pediatria');
  const primeiraFica = ['odontologia','psicologia'].includes(chaveQueixa(esp[0] || ''));
  const nova = primeiraFica ? [esp[0], 'Pediatria', ...esp.slice(1)] : ['Pediatria', ...esp];
  return { ...queixa, especialidades: nova, dicas: Object.assign({}, queixa.dicas, { Pediatria: 'Para crianças, o pediatra é a porta de entrada' }) };
}
function perguntaTempoPara(queixa){
  return `Entendi: <strong>${queixa.rotulo}</strong>. Faz quanto tempo que está assim?`;
}
function seguirDepoisDeQuem(queixa){
  const partes = queixa.rotulo.split(' e ');
  const perguntaTempo = !SEM_PERGUNTA_TEMPO.has(queixa.rotulo) && partes.some(p => !SEM_PERGUNTA_TEMPO.has(p));
  if(perguntaTempo){
    chatEsperando = queixa;
    falar(perguntaTempoPara(queixa), {
      atalhos: ['Começou hoje','Alguns dias','Mais de uma semana'],
      aoEscolher: (t) => {
        adicionarBalao(escaparHtml(t), 'eu');
        const q = chatEsperando; chatEsperando = null;
        responderComCaminho(q, t === 'Começou hoje' ? 'hoje' : t === 'Alguns dias' ? 'dias' : 'muito');
      }
    });
  } else {
    responderComCaminho(queixa, null, `Entendi: <strong>${queixa.rotulo}</strong>.`);
  }
}
// "Estou passando mal", "me sinto estranho": a pessoa não disse o quê. Perguntamos com opções.
function ehMalEstar(texto){
  const t = removerAcentos(texto.toLowerCase());
  return /(passando mal|sentindo mal|sinto mal|\bto mal|\btou mal|estou mal|nao (estou|to|tou) bem|nao me sinto bem|mal estar|mal-estar|indispost[oa]|estranh[oa]|me sentindo ruim|sinto ruim|esquisit[oa])/.test(t);
}
function perguntarMalEstar(){
  const mapa = { 'Enjoo ou vômito':'enjoo', 'Febre':'febre', 'Tontura':'tontura', 'Fraqueza ou cansaço':'cansaço', 'Ansiedade ou tristeza':'ansiedade' };
  falar('Entendi. O que você está sentindo?', {
    atalhos: ['Enjoo ou vômito','Febre','Dor','Tontura','Fraqueza ou cansaço','Ansiedade ou tristeza'],
    aoEscolher: (t) => {
      if(t === 'Dor'){ adicionarBalao('Dor', 'eu'); perguntarOndeDoi(); return; }
      receberMensagem(mapa[t], t);
    }
  });
}
function perguntarOndeDoi(){
  const mapa = { 'Cabeça':'dor de cabeça', 'Barriga':'dor de barriga', 'Costas':'dor nas costas', 'Peito':'dor no peito', 'Juntas ou músculos':'dor nas articulações', 'Dente':'dor de dente' };
  falar('Onde está doendo?', {
    atalhos: [...Object.keys(mapa), 'Outro lugar'],
    aoEscolher: (t) => {
      if(t === 'Outro lugar'){ adicionarBalao(t, 'eu'); falar('Me conta onde está doendo.'); return; }
      receberMensagem(mapa[t], t);
    }
  });
}

// texto: o que o chat interpreta; balao: o que aparece como fala da pessoa (quando ela tocou numa opção)
function receberMensagem(texto, balao){
  limparAtalhos();
  adicionarBalao(escaparHtml(balao || texto), 'eu');
  document.getElementById('chatEncerrar').hidden = false;

  // Se o chat tinha perguntado o tempo e a pessoa escreveu em vez de tocar, tentamos entender
  if(chatEsperando){
    const t = removerAcentos(texto.toLowerCase());
    const tempo = /hoje|agora|ontem|horas?/.test(t) ? 'hoje'
      : /semana|semanas|mes|meses|ano|anos|sempre|muito tempo/.test(t) ? 'muito'
      : /dias?|uns dias|alguns/.test(t) ? 'dias' : null;
    if(tempo){ const q = chatEsperando; chatEsperando = null; responderComCaminho(q, tempo); return; }
    chatEsperando = null; // não era resposta de tempo: segue como uma nova queixa
  }

  chatUltimoTexto = texto;
  const queixa = lerQueixa(texto);

  if(queixa && queixa.emergencia === 'fisica'){
    falar(`<strong>Isso pode ser uma emergência.</strong> Não espere por uma consulta: ligue para o SAMU ou vá agora ao pronto-socorro mais próximo.
      <a class="chat-btn chat-btn-urgente" href="tel:192">${ICON.phone}Ligar para o SAMU (192)</a>`, { urgente:true });
    return;
  }

  if(queixa && queixa.emergencia === 'emocional'){
    falar(`Obrigado por me contar. Você não precisa passar por isso sozinho. O CVV conversa com você agora, 24 horas por dia, de graça. Se houver risco imediato, ligue para o SAMU (192).
      <span class="chat-btns">
        <a class="chat-btn" href="tel:188">${ICON.phone}Ligar para o CVV (188)</a>
        <a class="chat-btn chat-btn-sec" href="https://cvv.org.br" target="_blank" rel="noopener">Conversar pelo chat do CVV</a>
      </span>`).then(() => {
        const lista = melhoresProfissionais(queixa, 3);
        if(lista.length) falar('Quando se sentir pronto, estes profissionais podem te acompanhar:', { depois: el => anexarCards(el, lista, queixa) });
      });
    return;
  }

  if(!queixa && ehMalEstar(texto)){ perguntarMalEstar(); return; }
  if(!queixa && /\b(dor|doendo|doi|doi|dolorido)\b/.test(removerAcentos(texto.toLowerCase()))){ perguntarOndeDoi(); return; }

  if(!queixa){
    falar('Não entendi bem. Você pode me contar onde dói ou o que está sentindo? Se preferir, toque em uma das opções:', { atalhos: ATALHOS_CHAT });
    return;
  }

  // "Meu filho está com febre": o pediatra entra no caminho, sem precisar perguntar
  chatPara = lerParaQuem(texto) === 'crianca' ? 'crianca' : 'eu';
  seguirDepoisDeQuem(queixa);
}

function responderComCaminho(queixa, tempo, abertura){
  queixa = ajustarParaCrianca(queixa);
  let especialidades = queixa.especialidades.slice();
  let comentario = abertura || '';
  if(tempo === 'muito' && especialidades.length > 1 && chaveQueixa(especialidades[0]) === 'clinica geral'){
    especialidades = [especialidades[1], especialidades[0], ...especialidades.slice(2)];
    comentario = 'Como já faz um tempo, vale ir direto em um especialista.';
  } else if(tempo === 'hoje'){
    comentario = 'Se piorar rápido ou ficar muito forte, procure um pronto atendimento.';
  } else if(tempo === 'dias'){
    comentario = 'Certo.';
  }
  const q = { ...queixa, especialidades, dicas: tempo === 'muito' && especialidades[0] !== queixa.especialidades[0]
    ? Object.assign({ [especialidades[0]]: 'Comece por aqui', [especialidades[1]]: 'Também pode te atender' }, queixa.dicas) : queixa.dicas };

  const etapas = q.especialidades.map((esp, i) => {
    const n = profissionaisDaEspecialidade(esp).length;
    return `<li class="${n ? '' : 'vazia'}"><span class="chat-num">${i + 1}</span><span><strong>${nomeProfissao(esp).replace('(a)', '')}</strong><small>${n ? dicaDaEtapa(q.dicas, esp, i) : 'Ainda sem cadastro por aqui'}</small></span></li>`;
  }).join('');

  falar(`${comentario ? comentario + ' ' : ''}Para esse caso, o caminho indicado é:
    <ol class="chat-caminho">${etapas}</ol>
    <span class="chat-nota">É um ponto de partida, não um diagnóstico.</span>`).then(() => {
      const lista = melhoresProfissionais(q, 3);
      if(!lista.length){
        falar('Ainda não temos essas especialidades cadastradas. Enquanto isso, um clínico geral ou a UBS do seu bairro podem te atender.',
          { atalhos: ['Contar outra coisa'], aoEscolher: (t) => { adicionarBalao(t, 'eu'); falar('Pode contar. O que você está sentindo?'); } });
        return;
      }
      const total = profissionais.filter(p => q.especialidades.map(chaveQueixa).includes(chaveQueixa(p.categoria))).length;
      falar(localizacaoUsuario ? 'Quem atende mais perto de você:' : 'Quem pode te atender:', {
        depois: el => {
          anexarCards(el, lista, q);
          const acoes = document.createElement('span');
          acoes.className = 'chat-btns';
          if(total > lista.length){
            acoes.innerHTML = `<button type="button" class="chat-btn chat-btn-sec" data-acao="todos">Ver todos os ${total}</button>`;
            el.appendChild(acoes);
            acoes.querySelector('[data-acao]').addEventListener('click', () => { fecharChat(); aplicarBusca(chatUltimoTexto); orientacaoEl.scrollIntoView({ behavior: semMovimento() ? 'auto' : 'smooth' }); });
          }
        }
      }).then(() => localizacaoUsuario || estadoLocal === 'indisponivel'
        ? oferecerContinuar()
        : perguntarLocalizacaoNoChat(q));
    });
}

// Depois de mostrar os profissionais, o chat oferece a localização (ou explica como liberar, se estiver bloqueada)
function perguntarLocalizacaoNoChat(queixa){
  const html = estadoLocal === 'negado'
    ? `Sua localização está bloqueada no navegador. Para ver quem está mais perto, toque no cadeado ao lado do endereço do site e permita a localização.
       <span class="chat-btns"><button type="button" class="chat-btn" data-acao="liberei">Já liberei</button><button type="button" class="chat-btn chat-btn-sec" data-acao="agora-nao">Agora não</button></span>`
    : `Quer ver quem está mais perto de você?
       <span class="chat-btns"><button type="button" class="chat-btn" data-acao="local">${ICON.locate}Usar minha localização</button><button type="button" class="chat-btn chat-btn-sec" data-acao="agora-nao">Agora não</button></span>`;
  return falar(html, { depois: el => ligarLocalNoChat(el, queixa) });
}

function ligarLocalNoChat(el, queixa){
  el.querySelectorAll('[data-acao]').forEach(b => b.addEventListener('click', () => {
    const acao = b.dataset.acao;
    const btns = b.closest('.chat-btns');
    if(btns) btns.remove();
    if(acao === 'agora-nao'){
      adicionarBalao('Agora não', 'eu');
      falar('Tudo bem.').then(oferecerContinuar);
      return;
    }
    adicionarBalao(acao === 'liberei' ? 'Já liberei' : 'Usar minha localização', 'eu');
    pedirLocalizacao().then(ok => {
      if(ok){
        falar('Pronto. Os mais perto de você:', { depois: e => anexarCards(e, melhoresProfissionais(queixa, 3), queixa) })
          .then(oferecerContinuar);
      } else if(estadoLocal === 'negado'){
        perguntarLocalizacaoNoChat(queixa);
      } else {
        falar('Não consegui pegar sua localização agora. Você pode tentar de novo pelo botão de cidade, na busca.');
      }
    });
  }));
}

function melhoresProfissionais(queixa, limite){
  const chaves = queixa.especialidades.map(chaveQueixa);
  return profissionais
    .filter(p => chaves.includes(chaveQueixa(p.categoria)))
    .sort((a, b) => {
      const prio = chaves.indexOf(chaveQueixa(a.categoria)) - chaves.indexOf(chaveQueixa(b.categoria));
      if(prio) return prio;
      const da = distanciasPorProfissional[profissionais.indexOf(a)] ?? Infinity;
      const db = distanciasPorProfissional[profissionais.indexOf(b)] ?? Infinity;
      return da - db;
    })
    .slice(0, limite);
}

function anexarCards(el, lista, queixa){
  const wrap = document.createElement('div');
  wrap.className = 'chat-cards';
  wrap.innerHTML = lista.map(p => {
    const idx = profissionais.indexOf(p);
    const d = distanciasPorProfissional[idx];
    return `
    <div class="chat-card" data-idx="${idx}" tabindex="0" role="button" aria-label="Ver perfil de ${p.nome}">
      <span class="chat-card-foto">${p.foto ? `<img src="${p.foto}" alt="" loading="lazy">` : iniciais(p.nome)}</span>
      <span class="chat-card-info"><strong>${p.nome}</strong><small>${nomeProfissao(p.categoria).replace('(a)', '')} · ${d !== undefined ? formatarDistancia(d) : textoCidades(p)}</small></span>
      <a class="chat-card-whats" href="https://wa.me/${p.whats}" target="_blank" rel="noopener" aria-label="Chamar ${p.nome} no WhatsApp">${ICON.chat}</a>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.chat-card').forEach(c => {
    const abrir = () => abrirModal(profissionais[c.dataset.idx]);
    c.addEventListener('click', (e) => { if(!e.target.closest('.chat-card-whats')) abrir(); });
    c.addEventListener('keydown', (e) => { if(e.target === c && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); abrir(); } });
  });
  el.appendChild(wrap);
  rolarChat();
}


chatFab.addEventListener('click', abrirChat);
document.getElementById('btnConversar').addEventListener('click', (e) => { e.stopPropagation(); abrirChat(); });
document.getElementById('chatFechar').addEventListener('click', () => { pararMic(); fecharChat(); });
document.getElementById('chatEncerrar').addEventListener('click', () => encerrarChat(false));

// ---------- Falar em vez de escrever (reconhecimento de voz do próprio navegador) ----------
// Funciona no Chrome (Android e computador), Edge e Safari (iPhone). Onde não existe, o botão não aparece.
const Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
const chatMic = document.getElementById('chatMic');
let reconhecedor = null;
let micTexto = '';
function pararMic(){ if(reconhecedor){ try{ reconhecedor.stop(); }catch(_){} } }
if(Reconhecimento){
  chatMic.hidden = false;
  chatMic.addEventListener('click', () => {
    if(reconhecedor){ pararMic(); return; }
    reconhecedor = new Reconhecimento();
    reconhecedor.lang = 'pt-BR';
    reconhecedor.interimResults = true;
    reconhecedor.continuous = false;
    micTexto = '';
    const placeholderAntes = chatInput.placeholder;
    chatMic.classList.add('gravando');
    chatMic.setAttribute('aria-label', 'Parar de gravar');
    chatInput.placeholder = 'Estou ouvindo…';
    reconhecedor.onresult = (e) => {
      micTexto = Array.from(e.results).map(r => r[0].transcript).join(' ').trim();
      chatInput.value = micTexto;
    };
    reconhecedor.onerror = (e) => {
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed')
        falar('Não consegui usar o microfone. Para liberar, toque no cadeado ao lado do endereço do site e permita o microfone. Ou, se preferir, é só escrever.');
    };
    reconhecedor.onend = () => {
      reconhecedor = null;
      chatMic.classList.remove('gravando');
      chatMic.setAttribute('aria-label', 'Falar em vez de escrever');
      chatInput.placeholder = placeholderAntes;
      if(micTexto) enviarChat(); // terminou de falar: já envia
    };
    try{ reconhecedor.start(); }catch(_){ reconhecedor = null; chatMic.classList.remove('gravando'); }
  });
}
// O botão flutuante só aparece depois que a barra de busca sai da tela
const heroPanel = document.querySelector('.hero-panel');
// ---------- Buscador que acompanha a rolagem ----------
// Quando o campo do balão some atrás do cabeçalho, um buscador compacto aparece no cabeçalho.
// É a mesma busca: o que se digita em um aparece no outro. O ícone de conversa abre o chat.
const siteHeaderEl = document.getElementById('siteHeader');
const buscaMiniInput = document.getElementById('buscaMiniInput');
let campoPrincipalForaDaTela = false;

function atualizarBuscaFixa(){
  const mostrar = campoPrincipalForaDaTela || document.activeElement === buscaMiniInput;
  siteHeaderEl.classList.toggle('com-busca', mostrar);
  document.body.classList.toggle('busca-fixa-ativa', mostrar);
  // fora de vista, os controles do cabeçalho não entram na navegação por teclado
  buscaMiniInput.tabIndex = mostrar ? 0 : -1;
  document.getElementById('buscaMiniChat').tabIndex = mostrar ? 0 : -1;
}

buscaMiniInput.addEventListener('focus', atualizarBuscaFixa);
buscaMiniInput.addEventListener('blur', atualizarBuscaFixa);
buscaMiniInput.addEventListener('input', () => {
  aplicarBusca(buscaMiniInput.value);
  // mantém o começo dos resultados logo abaixo do cabeçalho enquanto a pessoa digita
  const faixa = document.getElementById('buscaMiniFaixa');
  const extra = getComputedStyle(faixa).position === 'absolute' ? faixa.offsetHeight : 0;
  // o balão fica todo escondido atrás do cabeçalho e os resultados começam logo depois
  const alvo = document.getElementById('buscaBalao').getBoundingClientRect().bottom + scrollY - siteHeaderEl.offsetHeight - extra + 2;
  window.scrollTo(0, Math.max(alvo, 0));
});
buscaMiniInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); buscaMiniInput.blur(); }
});
document.getElementById('buscaMiniChat').addEventListener('click', (e) => { e.stopPropagation(); abrirChat(); });

// Observa só o campo branco do balão: quando ele passa por baixo do cabeçalho, o buscador compacto entra
let observadorBuscaFixa = null;
function observarCampoPrincipal(){
  if(observadorBuscaFixa) observadorBuscaFixa.disconnect();
  observadorBuscaFixa = new IntersectionObserver(([e]) => {
    campoPrincipalForaDaTela = !e.isIntersecting;
    atualizarBuscaFixa();
  }, { rootMargin: `-${siteHeaderEl.offsetHeight}px 0px 0px 0px` });
  observadorBuscaFixa.observe(document.querySelector('.busca-balao .tag-search-inner'));
}
observarCampoPrincipal();
matchMedia('(max-width:560px)').addEventListener('change', observarCampoPrincipal);

render();
abrirPorLink();
</script>
